# T4 / FO-4: build the Anjuna Form for an explicit release, prove the bundle is brand-clean, and store it
# in R2 as an immutable `form@<sha>/` prefix with a SHA-256 manifest. Brand Workers (T7/T10)
# copy from that prefix; nothing here deploys a Worker.
#
# The same release also writes one ZIP at `forms/form-<sha7>`, the key the factory install Workflow
# reads (workers/factory/src/render.ts readZipFromR2). It is built from the manifest-verified dist,
# its SHA-256 is printed in the job log and step summary, and the owner registers it with
# POST /api/form-artifacts (docs/runbooks/form-artifact-release.md). Nothing here writes to D1.
#
# Required configuration (names only; values live in GitHub, never in git):
#   secrets.CLOUDFLARE_API_TOKEN   scoped token with R2:Edit on the artifacts bucket (O2)
#   secrets.CLOUDFLARE_ACCOUNT_ID  account that owns the bucket
#   vars.R2_ARTIFACTS_BUCKET       bucket name for template/form artifacts
#   vars.FORBIDDEN_DOMAINS         optional, comma-separated live brand domains for the bundle scan
name: lead-form

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-form-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lead-form
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (includes a production build + bundle scan)
        run: bun run test

      - name: Build
        env:
          VITE_FORM_RELEASE: ${{ github.sha }}
        run: bunx vite build

      - name: Scan bundle (no brand domain, no "anjuna"/"aurum", no PostHog key, no Sentry DSN)
        env:
          FORBIDDEN_DOMAINS: ${{ vars.FORBIDDEN_DOMAINS }}
        run: node scripts/check-bundle.mjs dist

      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Browser acceptance against the local brand Worker
        timeout-minutes: 15
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          python -m unittest discover -s e2e -p 'test_*.py'
          mkdir -p .e2e
          node e2e/serve.mjs > .e2e/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .e2e/server.log
              exit 1
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:8799/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat .e2e/server.log
            echo "::error::Local brand Worker did not become ready"
            exit 1
          fi
          python e2e/ui_e2e.py http://127.0.0.1:8799 --runs 8
          python e2e/ui_e2e.py http://127.0.0.1:8799 --runs 8 --cpu-rate 4

      - name: SHA-256 manifest
        run: |
          node scripts/manifest.mjs dist --version "$GITHUB_SHA" --out "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" dist/manifest.json
          cat dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: form-${{ github.sha }}
          path: apps/lead-form/dist
          if-no-files-found: error
          retention-days: 7

  upload:
    # Publishing is a release action: version tags or explicit manual dispatch only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    environment: r2-artifacts
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_ARTIFACTS_BUCKET }}
      PREFIX: form@${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the r2-artifacts environment settings
        run: |
          set -euo pipefail
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::r2-artifacts environment is missing secrets.CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::r2-artifacts environment is missing secrets.CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -n "$R2_BUCKET" ] || { echo "::error::r2-artifacts environment is missing vars.R2_ARTIFACTS_BUCKET"; missing=1; }
          exit "$missing"

      - uses: actions/download-artifact@v4
        with:
          name: form-${{ github.sha }}
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify artifact against its manifest
        working-directory: dist
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (m.version !== process.env.GITHUB_SHA) throw new Error("manifest version mismatch");
            for (const f of m.files) {
              const h = crypto.createHash("sha256").update(fs.readFileSync(f.path)).digest("hex");
              if (h !== f.sha256) throw new Error("hash mismatch: " + f.path);
            }
            console.log("verified", m.files.length, "files, bundle_sha256", m.bundle_sha256);
          '

      - name: Derive the form artifact identity (same convention as the registered form-0e113de row)
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA:0:7}"
          # The payload version is what the form sends as form_version; core accepts only its own FORM_VERSION.
          payload_version="$(sed -n 's/^  formVersion: "\([^"]*\)",$/\1/p' apps/lead-form/src/App.tsx)"
          [ -n "$payload_version" ] || { echo "::error::formVersion not found in apps/lead-form/src/App.tsx"; exit 1; }
          {
            echo "FORM_ARTIFACT_ID=form-$sha7"
            echo "ZIP_KEY=forms/form-$sha7"
            echo "BUNDLE_FORM_VERSION=form@$sha7"
            echo "PAYLOAD_VERSION=$payload_version"
          } >> "$GITHUB_ENV"

      - name: Pack the verified dist into the factory ZIP (deterministic, sorted, stored, fixed timestamps)
        run: |
          set -euo pipefail
          node apps/lead-form/scripts/form-zip.mjs dist --out "$RUNNER_TEMP/form.zip" | tee "$RUNNER_TEMP/form-zip.json"
          zip_sha256="$(sha256sum "$RUNNER_TEMP/form.zip" | cut -d' ' -f1)"
          [ "$zip_sha256" = "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).sha256' "$RUNNER_TEMP/form-zip.json")" ] \
            || { echo "::error::ZIP SHA-256 differs between the script and sha256sum"; exit 1; }
          echo "ZIP_SHA256=$zip_sha256" >> "$GITHUB_ENV"
          echo "$ZIP_KEY sha256 $zip_sha256"

      - name: Skip if this version is already published (form@sha is immutable)
        id: exists
        run: |
          if npx --yes wrangler@4 r2 object get "$R2_BUCKET/$PREFIX/manifest.json" --remote --file "$RUNNER_TEMP/existing.json" >/dev/null 2>&1; then
            if cmp -s "$RUNNER_TEMP/existing.json" dist/manifest.json; then
              echo "published=true" >> "$GITHUB_OUTPUT"; echo "$PREFIX already published with the same manifest"
            else
              echo "::error::$PREFIX exists with a DIFFERENT manifest; refusing to overwrite"; exit 1
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to R2 (files first, manifest last)
        if: steps.exists.outputs.published != 'true'
        working-directory: dist
        run: |
          set -euo pipefail
          ctype() {
            case "$1" in
              *.html) echo "text/html; charset=utf-8" ;;
              *.js) echo "text/javascript; charset=utf-8" ;;
              *.css) echo "text/css; charset=utf-8" ;;
              *.json) echo "application/json" ;;
              *.svg) echo "image/svg+xml" ;;
              *.woff2) echo "font/woff2" ;;
              *.woff) echo "font/woff" ;;
              *) echo "application/octet-stream" ;;
            esac
          }
          node -e 'for (const f of JSON.parse(require("fs").readFileSync("manifest.json","utf8")).files) console.log(f.path)' |
          while IFS= read -r path; do
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$PREFIX/$path" --remote \
              --file "$path" --content-type "$(ctype "$path")" \
              --cache-control "public, max-age=31536000, immutable"
          done
          # The manifest is written last: its presence marks the prefix as complete.
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$PREFIX/manifest.json" --remote \
            --file manifest.json --content-type "application/json" --cache-control "no-store"
          echo "published $PREFIX"

      # Separate from the loose files so a tag published before the ZIP existed can be re-run to get one.
      - name: Upload the factory ZIP (refuses to overwrite a different ZIP)
        run: |
          set -euo pipefail
          if npx --yes wrangler@4 r2 object get "$R2_BUCKET/$ZIP_KEY" --remote --file "$RUNNER_TEMP/existing.zip" >/dev/null 2>&1; then
            if cmp -s "$RUNNER_TEMP/existing.zip" "$RUNNER_TEMP/form.zip"; then
              echo "$ZIP_KEY already published with the same bytes"
            else
              echo "::error::$ZIP_KEY exists with DIFFERENT bytes; refusing to overwrite"; exit 1
            fi
          else
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$ZIP_KEY" --remote \
              --file "$RUNNER_TEMP/form.zip" --content-type "application/zip" --cache-control "no-store"
            echo "published $ZIP_KEY"
          fi

      - name: Print what the owner registers
        run: |
          set -euo pipefail
          {
            echo "### Form artifact $FORM_ARTIFACT_ID"
            echo
            echo "- R2 key: \`$ZIP_KEY\`"
            echo "- ZIP SHA-256: \`$ZIP_SHA256\`"
            echo
            echo "Owner request, \`POST /api/form-artifacts\` (set \`template_version_id\` to a sealed template version):"
            echo
            echo '```json'
            echo "{\"form_artifact_id\":\"$FORM_ARTIFACT_ID\",\"template_version_id\":\"<sealed template version id>\",\"git_sha\":\"$GITHUB_SHA\",\"bundle_form_version\":\"$BUNDLE_FORM_VERSION\",\"payload_version\":\"$PAYLOAD_VERSION\",\"manifest_sha256\":\"$ZIP_SHA256\"}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
