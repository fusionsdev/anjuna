name: Deploy

on:
  push:
    tags:
      - "v*"

# Each tenant deploys sequentially: owner first, friend second.
# Each job uses its own GitHub Environment, which holds that tenant's
# CLOUDFLARE_API_TOKEN and secrets — a token cannot touch the other tenant's account.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build once; artifacts are shared across deploy jobs.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            workers/core/dist/
            apps/web/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Owner tenant (aduplift) — deploys to Cloudflare account 6cb8500c...
  # ─────────────────────────────────────────────────────────────────────────
  deploy-aduplift:
    name: Deploy (aduplift)
    needs: build
    runs-on: ubuntu-latest
    environment: aduplift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (aduplift)
        run: |
          bun x wrangler d1 migrations apply aduplift-leads   --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-factory --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-auth    --remote --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Deploy core (aduplift)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Set core secrets (aduplift)
        run: |
          echo "${{ secrets.DRAIN_TOKEN }}"          | bun x wrangler secret put DRAIN_TOKEN          --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "${{ secrets.POSTBACK_TOKEN_SALT }}"  | bun x wrangler secret put POSTBACK_TOKEN_SALT  --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Smoke test core (aduplift)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://core.aduplift.ai/api/admin/brands)
          test "$STATUS" = "401" || (echo "core smoke test failed: got $STATUS"; exit 1)

      - name: Deploy web (aduplift)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Set web secrets (aduplift)
        run: |
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Smoke test web (aduplift)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app.aduplift.ai/)
          test "$STATUS" = "200" || (echo "web smoke test failed: got $STATUS"; exit 1)

  # ─────────────────────────────────────────────────────────────────────────
  # Friend tenant — deploys to friend's Cloudflare account (separate token).
  # Waits for aduplift to succeed first.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-friend:
    name: Deploy (friend)
    needs: deploy-aduplift
    runs-on: ubuntu-latest
    environment: friend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FRIEND_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (friend)
        run: |
          bun x wrangler d1 migrations apply friend-leads   --remote --config workers/core/wrangler.deploy.friend.jsonc
          bun x wrangler d1 migrations apply friend-factory --remote --config workers/core/wrangler.deploy.friend.jsonc
          bun x wrangler d1 migrations apply friend-auth    --remote --config apps/web/wrangler.deploy.friend.jsonc

      - name: Deploy core (friend)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.friend.jsonc

      - name: Set core secrets (friend)
        run: |
          echo "${{ secrets.FRIEND_DRAIN_TOKEN }}"         | bun x wrangler secret put DRAIN_TOKEN         --config workers/core/wrangler.deploy.friend.jsonc
          echo "${{ secrets.FRIEND_POSTBACK_TOKEN_SALT }}" | bun x wrangler secret put POSTBACK_TOKEN_SALT --config workers/core/wrangler.deploy.friend.jsonc

      - name: Smoke test core (friend)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.FRIEND_CORE_DOMAIN }}/api/admin/brands)
          test "$STATUS" = "401" || (echo "friend core smoke test failed: got $STATUS"; exit 1)

      - name: Deploy web (friend)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.friend.jsonc

      - name: Set web secrets (friend)
        run: |
          echo "${{ secrets.FRIEND_BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.friend.jsonc

      - name: Smoke test web (friend)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.FRIEND_APP_DOMAIN }}/)
          test "$STATUS" = "200" || (echo "friend web smoke test failed: got $STATUS"; exit 1)
