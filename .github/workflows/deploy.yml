name: Deploy

on:
  push:
    tags:
      - "v*"

# Each tenant deploys sequentially: owner first, maimax second.
# Each job uses its own GitHub Environment, which holds that tenant's
# CLOUDFLARE_API_TOKEN and secrets — a token cannot touch the other tenant's account.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build once; artifacts are shared across deploy jobs.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            workers/core/dist/
            apps/web/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Owner tenant (aduplift) — deploys to Cloudflare account 6cb8500c...
  # ─────────────────────────────────────────────────────────────────────────
  deploy-aduplift:
    name: Deploy (aduplift)
    needs: build
    runs-on: ubuntu-latest
    environment: aduplift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (aduplift)
        run: |
          bun x wrangler d1 migrations apply aduplift-leads   --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-factory --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-auth    --remote --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Deploy core (aduplift)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Check factory secrets (aduplift)
        run: |
          bun x wrangler secret list --config workers/factory/wrangler.aduplift.jsonc > /tmp/factory-secrets.json
          MISSING=""
          for NAME in CF_API_TOKEN CORE_TOKEN; do
            jq -e --arg n "$NAME" 'map(.name) | index($n)' /tmp/factory-secrets.json > /dev/null || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "anjuna-factory (aduplift) is missing secret(s):$MISSING"
            echo "The owner must set them once:"
            for NAME in $MISSING; do
              echo "  bun x wrangler secret put $NAME --config workers/factory/wrangler.aduplift.jsonc"
            done
            exit 1
          fi

      - name: Deploy factory (aduplift)
        run: bun x wrangler deploy --config workers/factory/wrangler.aduplift.jsonc

      - name: Set core secrets (aduplift)
        run: |
          echo "${{ secrets.DRAIN_TOKEN }}"          | bun x wrangler secret put DRAIN_TOKEN          --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "${{ secrets.POSTBACK_TOKEN_SALT }}"  | bun x wrangler secret put POSTBACK_TOKEN_SALT  --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Set postback token (aduplift)
        env:
          POSTBACK_TOKEN: ${{ secrets.POSTBACK_TOKEN }}
        run: |
          [ -z "$POSTBACK_TOKEN" ] && echo "POSTBACK_TOKEN not set, keeping the current core secret" && exit 0
          printf '%s' "$POSTBACK_TOKEN" | bun x wrangler secret put POSTBACK_TOKEN --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Set listmonk secrets (aduplift)
        env:
          LISTMONK_URL: ${{ secrets.LISTMONK_URL }}
          LISTMONK_USER: ${{ secrets.LISTMONK_USER }}
          LISTMONK_TOKEN: ${{ secrets.LISTMONK_TOKEN }}
          LISTMONK_LIST_MAP: ${{ secrets.LISTMONK_LIST_MAP }}
        run: |
          [ -z "$LISTMONK_URL" ] && echo "LISTMONK_URL not set, skipping" && exit 0
          echo "$LISTMONK_URL"      | bun x wrangler secret put LISTMONK_URL      --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "$LISTMONK_USER"     | bun x wrangler secret put LISTMONK_USER     --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "$LISTMONK_TOKEN"    | bun x wrangler secret put LISTMONK_TOKEN    --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "$LISTMONK_LIST_MAP" | bun x wrangler secret put LISTMONK_LIST_MAP --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Smoke test core (aduplift)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://core.aduplift.ai/api/conversions/pending)
          test "$STATUS" = "401" || (echo "core smoke test failed: got $STATUS"; exit 1)

      # After the core smoke test: new brand runtimes ask core for site text, which only the new core answers.
      - name: Build and upload brand runtime bundle (aduplift)
        run: |
          bun run --filter @anjuna/brand-runtime bundle
          sha256sum packages/brand-runtime/dist/brand-runtime.js
          bunx wrangler r2 object put anjuna-artifacts/runtime/brand-runtime.js --file packages/brand-runtime/dist/brand-runtime.js --content-type application/javascript --remote --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Deploy template MCP (aduplift)
        run: bun x wrangler deploy --config workers/template-mcp/wrangler.jsonc

      - name: Smoke test template MCP (aduplift)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mcp.aduplift.ai/health)
          test "$STATUS" = "200" || (echo "template MCP smoke test failed: got $STATUS"; exit 1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "content-type: application/json" -d '{}' https://mcp.aduplift.ai/mcp)
          test "$STATUS" = "401" || (echo "template MCP smoke test failed: POST /mcp without a key got $STATUS"; exit 1)

      - name: Deploy web (aduplift)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Set web secrets (aduplift)
        run: |
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Smoke test web (aduplift)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          bash scripts/smoke-web.sh "https://app.aduplift.ai/" apps/web/dist/client/index.html

  # ─────────────────────────────────────────────────────────────────────────
  # Maimax tenant — deploys to the maimax Cloudflare account (separate token).
  # Waits for aduplift to succeed first.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-maimax:
    name: Deploy (maimax)
    needs: deploy-aduplift
    # Off until the maimax tenant setup is finished. Set repo variable MAIMAX_ENABLED=true to turn on.
    if: ${{ vars.MAIMAX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: maimax
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MAIMAX_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (maimax)
        run: |
          bun x wrangler d1 migrations apply maimax-leads   --remote --config workers/core/wrangler.deploy.maimax.jsonc
          bun x wrangler d1 migrations apply maimax-factory --remote --config workers/core/wrangler.deploy.maimax.jsonc
          bun x wrangler d1 migrations apply maimax-auth    --remote --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Deploy core (maimax)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.maimax.jsonc

      # The factory binds core's FactoryLifecycleService, and web binds the factory,
      # so the factory deploys after core and before web.
      - name: Check factory secrets (maimax)
        run: |
          bun x wrangler secret list --config workers/factory/wrangler.maimax.jsonc > /tmp/factory-secrets.json
          MISSING=""
          for NAME in CF_API_TOKEN CORE_TOKEN; do
            jq -e --arg n "$NAME" 'map(.name) | index($n)' /tmp/factory-secrets.json > /dev/null || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "anjuna-factory (maimax) is missing secret(s):$MISSING"
            echo "The owner must set them once:"
            for NAME in $MISSING; do
              echo "  bun x wrangler secret put $NAME --config workers/factory/wrangler.maimax.jsonc"
            done
            exit 1
          fi

      - name: Deploy factory (maimax)
        run: bun x wrangler deploy --config workers/factory/wrangler.maimax.jsonc

      - name: Set core secrets (maimax)
        run: |
          echo "${{ secrets.MAIMAX_DRAIN_TOKEN }}"         | bun x wrangler secret put DRAIN_TOKEN         --config workers/core/wrangler.deploy.maimax.jsonc
          echo "${{ secrets.MAIMAX_POSTBACK_TOKEN_SALT }}" | bun x wrangler secret put POSTBACK_TOKEN_SALT --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Set postback token (maimax)
        env:
          POSTBACK_TOKEN: ${{ secrets.MAIMAX_POSTBACK_TOKEN }}
        run: |
          [ -z "$POSTBACK_TOKEN" ] && echo "MAIMAX_POSTBACK_TOKEN not set, keeping the current core secret" && exit 0
          printf '%s' "$POSTBACK_TOKEN" | bun x wrangler secret put POSTBACK_TOKEN --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Set listmonk secrets (maimax)
        env:
          LISTMONK_URL: ${{ secrets.MAIMAX_LISTMONK_URL }}
          LISTMONK_USER: ${{ secrets.MAIMAX_LISTMONK_USER }}
          LISTMONK_TOKEN: ${{ secrets.MAIMAX_LISTMONK_TOKEN }}
          LISTMONK_LIST_MAP: ${{ secrets.MAIMAX_LISTMONK_LIST_MAP }}
        run: |
          [ -z "$LISTMONK_URL" ] && echo "MAIMAX_LISTMONK_URL not set, skipping" && exit 0
          echo "$LISTMONK_URL"      | bun x wrangler secret put LISTMONK_URL      --config workers/core/wrangler.deploy.maimax.jsonc
          echo "$LISTMONK_USER"     | bun x wrangler secret put LISTMONK_USER     --config workers/core/wrangler.deploy.maimax.jsonc
          echo "$LISTMONK_TOKEN"    | bun x wrangler secret put LISTMONK_TOKEN    --config workers/core/wrangler.deploy.maimax.jsonc
          echo "$LISTMONK_LIST_MAP" | bun x wrangler secret put LISTMONK_LIST_MAP --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Smoke test core (maimax)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.MAIMAX_CORE_DOMAIN }}/api/conversions/pending)
          test "$STATUS" = "401" || (echo "maimax core smoke test failed: got $STATUS"; exit 1)

      # After the core smoke test: new brand runtimes ask core for site text, which only the new core answers.
      - name: Build and upload brand runtime bundle (maimax)
        run: |
          bun run --filter @anjuna/brand-runtime bundle
          sha256sum packages/brand-runtime/dist/brand-runtime.js
          bunx wrangler r2 object put anjuna-artifacts/runtime/brand-runtime.js --file packages/brand-runtime/dist/brand-runtime.js --content-type application/javascript --remote --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Deploy template MCP (maimax)
        run: bun x wrangler deploy --config workers/template-mcp/wrangler.maimax.jsonc

      - name: Smoke test template MCP (maimax)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mcp.maimax.com/health)
          test "$STATUS" = "200" || (echo "maimax template MCP smoke test failed: got $STATUS"; exit 1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "content-type: application/json" -d '{}' https://mcp.maimax.com/mcp)
          test "$STATUS" = "401" || (echo "maimax template MCP smoke test failed: POST /mcp without a key got $STATUS"; exit 1)

      - name: Deploy web (maimax)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Set web secrets (maimax)
        run: |
          echo "${{ secrets.MAIMAX_BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Smoke test web (maimax)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAIMAX_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAIMAX_CF_ACCESS_CLIENT_SECRET }}
        run: |
          bash scripts/smoke-web.sh "https://${{ vars.MAIMAX_APP_DOMAIN }}/" apps/web/dist/client/index.html
