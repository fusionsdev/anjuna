name: Deploy

on:
  push:
    tags:
      - "v*"

# Each tenant deploys sequentially: owner first, maimax second.
# Each job uses its own GitHub Environment, which holds that tenant's
# CLOUDFLARE_API_TOKEN and secrets — a token cannot touch the other tenant's account.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build once; artifacts are shared across deploy jobs.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            workers/core/dist/
            apps/web/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # Owner tenant (aduplift) — deploys to Cloudflare account 6cb8500c...
  # ─────────────────────────────────────────────────────────────────────────
  deploy-aduplift:
    name: Deploy (aduplift)
    needs: build
    runs-on: ubuntu-latest
    environment: aduplift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (aduplift)
        run: |
          bun x wrangler d1 migrations apply aduplift-leads   --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-factory --remote --config workers/core/wrangler.deploy.aduplift.jsonc
          bun x wrangler d1 migrations apply aduplift-auth    --remote --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Deploy core (aduplift)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Set core secrets (aduplift)
        run: |
          echo "${{ secrets.DRAIN_TOKEN }}"          | bun x wrangler secret put DRAIN_TOKEN          --config workers/core/wrangler.deploy.aduplift.jsonc
          echo "${{ secrets.POSTBACK_TOKEN_SALT }}"  | bun x wrangler secret put POSTBACK_TOKEN_SALT  --config workers/core/wrangler.deploy.aduplift.jsonc

      - name: Smoke test core (aduplift)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://core.aduplift.ai/api/conversions/pending)
          test "$STATUS" = "401" || (echo "core smoke test failed: got $STATUS"; exit 1)

      - name: Deploy web (aduplift)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Set web secrets (aduplift)
        run: |
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.aduplift.jsonc

      - name: Smoke test web (aduplift)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          bash scripts/smoke-web.sh "https://app.aduplift.ai/" apps/web/dist/client/index.html

  # ─────────────────────────────────────────────────────────────────────────
  # Maimax tenant — deploys to the maimax Cloudflare account (separate token).
  # Waits for aduplift to succeed first.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-maimax:
    name: Deploy (maimax)
    needs: deploy-aduplift
    # Maimax's Cloudflare account and wrangler.deploy.maimax.jsonc files do not exist
    # yet (Wave 4 O7, owner-gated). Set repo variable MAIMAX_ENABLED=true to turn on.
    if: ${{ vars.MAIMAX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: maimax
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MAIMAX_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations (maimax)
        run: |
          bun x wrangler d1 migrations apply maimax-leads   --remote --config workers/core/wrangler.deploy.maimax.jsonc
          bun x wrangler d1 migrations apply maimax-factory --remote --config workers/core/wrangler.deploy.maimax.jsonc
          bun x wrangler d1 migrations apply maimax-auth    --remote --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Deploy core (maimax)
        run: bun x wrangler deploy --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Set core secrets (maimax)
        run: |
          echo "${{ secrets.MAIMAX_DRAIN_TOKEN }}"         | bun x wrangler secret put DRAIN_TOKEN         --config workers/core/wrangler.deploy.maimax.jsonc
          echo "${{ secrets.MAIMAX_POSTBACK_TOKEN_SALT }}" | bun x wrangler secret put POSTBACK_TOKEN_SALT --config workers/core/wrangler.deploy.maimax.jsonc

      - name: Smoke test core (maimax)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.MAIMAX_CORE_DOMAIN }}/api/conversions/pending)
          test "$STATUS" = "401" || (echo "maimax core smoke test failed: got $STATUS"; exit 1)

      - name: Deploy web (maimax)
        run: bun x wrangler deploy --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Set web secrets (maimax)
        run: |
          echo "${{ secrets.MAIMAX_BETTER_AUTH_SECRET }}" | bun x wrangler secret put BETTER_AUTH_SECRET --config apps/web/wrangler.deploy.maimax.jsonc

      - name: Smoke test web (maimax)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAIMAX_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAIMAX_CF_ACCESS_CLIENT_SECRET }}
        run: |
          bash scripts/smoke-web.sh "https://${{ vars.MAIMAX_APP_DOMAIN }}/" apps/web/dist/client/index.html
